name: Project change
description: Propose a change to DKKB tooling, taxonomy, governance, or site behavior.
title: "project: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete project problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: maintenance
    attributes:
      label: Maintenance and infrastructure effect
      description: Explain new dependencies, recurring work, hosting cost, or portability effects.
    validations:
      required: true
