name: Pages

on:
  release:
    types: [published]

concurrency:
  group: pages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact_name }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record build identity
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          commit=$(git rev-parse HEAD)
          artifact_name="dkkb-pages-${RELEASE_TAG}-${commit}"
          echo "DKKB_RELEASE=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "DKKB_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'Building release %s from commit %s\n' "$RELEASE_TAG" "$commit"
      - name: Validate and build
        run: pnpm check
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: dist
          retention-days: 90
  deploy:
    name: Deploy
    needs: build
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
  verify:
    name: Verify
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
      - name: Resolve release identity
        run: echo "DKKB_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify deployed site
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page-url }}
          DKKB_RELEASE: ${{ github.event.release.tag_name }}
        run: node scripts/verify-deployment.mjs
