name: Canonical label sync (temporary)

on:
  push:
    branches:
      - chore/sync-canonical-labels-20260907

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync canonical labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync labels from dk-devkit manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="80ed968bc70c9efd79d7ab5b2961b0390cf82a62"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/daniel-kindl/dk-devkit/${ref}/bin/repo-labels" \
            --output /tmp/repo-labels
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/daniel-kindl/dk-devkit/${ref}/manifests/github-labels.json" \
            --output /tmp/github-labels.json
          chmod +x /tmp/repo-labels
          /tmp/repo-labels sync \
            --repo "$GITHUB_REPOSITORY" \
            --config /tmp/github-labels.json \
            --yes
